<div class="enterprise-layout">
  <!-- Top Navigation Bar -->
  <app-navbar (toggleSidebar)="toggleSidebar()" />

  <!-- Main Split Body -->
  <div class="enterprise-body">
    <main class="main-canvas">
      <div class="content-wrapper">
        <!-- Natural Language Query & Filter Header -->
        <app-query-header />

        <!-- Active Context Banner if item selected for AI query -->
        @if (selectedItemContext(); as ctx) {
          <div class="context-banner">
            <div class="context-info">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="context-icon">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span>Active Context for AI: <strong>{{ ctx.name }}</strong> (<code>{{ ctx.sku }}</code>) in <strong>{{ ctx.subgraph }}</strong></span>
            </div>
            <button type="button" class="btn-clear-context" (click)="clearContext()">
              Clear Context
            </button>
          </div>
        }

        <!-- Dynamic State Rendering: Loading, Error, Empty, or DataGrid -->
        @if (dataService.viewState() === 'loading') {
          <app-loading-state />
        } @else if (dataService.viewState() === 'error') {
          <app-error-state />
        } @else if (dataService.viewState() === 'empty') {
          <app-empty-state />
        } @else {
          <app-data-grid (askCopilot)="onAskItemCopilot($event)" />
        }
      </div>
    </main>

    <!-- Right-Side Copilot Assistant Sidebar -->
    <copilot-sidebar 
      [(open)]="sidebarOpen" 
      title="ERP Copilot Assistant" 
      position="right" 
      [width]="480" />
  </div>
</div>
