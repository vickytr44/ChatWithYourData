"""
Searches inventory products, categories, pricing, and warehouse stock levels with flexible filtering and sorting.
"""
query SearchProductsAndInventory(
  $where: ProductFilterInput
  $order: [ProductSortInput!]
  $first: Int
) {
  products(where: $where, order: $order, first: $first) {
    nodes {
      id
      sku
      name
      description
      unitPrice
      unitOfMeasure
      isActive
      category {
        id
        name
        description
      }
      stockItems {
        id
        warehouseId
        quantityOnHand
        quantityReserved
        reorderPoint
        warehouse {
          id
          code
          name
          locationAddress
        }
      }
    }
  }
}
