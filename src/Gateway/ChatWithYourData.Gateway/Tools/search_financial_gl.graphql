"""
Searches chart of accounts and general ledger journal entries with flexible filtering and sorting.
"""
query SearchFinancialGL(
  $whereAccounts: AccountFilterInput
  $whereJournals: JournalEntryFilterInput
  $first: Int
) {
  accounts(where: $whereAccounts, first: $first) {
    nodes {
      id
      accountCode
      name
      type
      description
      currentBalance
      isActive
    }
  }
  journalEntries(where: $whereJournals, first: $first) {
    nodes {
      id
      entryNumber
      entryDateUtc
      description
      reference
      isPosted
      lines {
        id
        accountId
        debitAmount
        creditAmount
        memo
        account {
          id
          accountCode
          name
        }
      }
    }
  }
}
