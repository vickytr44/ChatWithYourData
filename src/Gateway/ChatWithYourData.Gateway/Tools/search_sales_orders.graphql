"""
Searches customer sales orders, line items, and customer details with flexible filtering and sorting.
"""
query SearchSalesOrders(
  $where: SalesOrderFilterInput
  $order: [SalesOrderSortInput!]
  $first: Int
) {
  salesOrders(where: $where, order: $order, first: $first) {
    nodes {
      id
      orderNumber
      orderDateUtc
      status
      totalAmount
      notes
      customer {
        id
        customerNumber
        name
        email
        phone
        billingAddress
        shippingAddress
      }
      lines {
        id
        productId
        sku
        productName
        quantity
        unitPrice
        discountPercentage
        lineTotal
      }
    }
  }
}
