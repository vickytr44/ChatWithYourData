"""
Searches customer invoices, totals, status, and payment transaction history with flexible filtering and sorting.
"""
query SearchInvoicesAndPayments(
  $where: InvoiceFilterInput
  $order: [InvoiceSortInput!]
  $first: Int
) {
  invoices(where: $where, order: $order, first: $first) {
    nodes {
      id
      invoiceNumber
      customerId
      salesOrderId
      issueDateUtc
      dueDateUtc
      status
      subtotal
      taxAmount
      totalAmount
      paidAmount
      notes
      payments {
        id
        paymentNumber
        paymentDateUtc
        amount
        method
        referenceNumber
      }
    }
  }
}
